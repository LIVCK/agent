name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # .go-version names the release line; check-latest picks its newest
          # patch on every run, so a Go security release needs no change here.
          go-version-file: .go-version
          check-latest: true
          cache: true
          cache-dependency-path: go.sum

      - name: Build agent (static)
        run: CGO_ENABLED=0 GOARCH=${{ matrix.goarch }} go build -trimpath ./...

      - name: Build wire module
        run: cd pkg/wire && CGO_ENABLED=0 GOARCH=${{ matrix.goarch }} go build ./...

  test:
    name: Vet, Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # .go-version names the release line; check-latest picks its newest
          # patch on every run, so a Go security release needs no change here.
          go-version-file: .go-version
          check-latest: true
          cache: true
          cache-dependency-path: go.sum

      - name: Vet
        run: go vet ./...

      # The prebuilt linter must be built with a Go release at least as new as
      # the one in .go-version, or it aborts while loading packages.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

      - name: Test (race)
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Test wire module
        run: cd pkg/wire && go test -race ./...

      # Run any fuzz targets briefly if the repo has them.
      - name: Fuzz smoke
        run: |
          if grep -rqs "func Fuzz" --include="*_test.go" .; then
            go test -run='^$' -fuzz=. -fuzztime=20s ./... || true
          else
            echo "no fuzz targets"
          fi

  scripts:
    name: Served scripts
    runs-on: ubuntu-latest # ships dash (/bin/sh) + shellcheck preinstalled
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The get.livck.cloud-SERVED install.sh (placeholders replaced by the real
      # systemd units) is what customers pipe into `sh` — syntax-check that form,
      # not just the raw source. Guards the "unit-with-apostrophe broke the grep
      # guard" class that a raw `sh -n` never sees.
      - name: Check served install.sh (raw + assembled)
        run: sh packaging/test/check-served-scripts.sh
