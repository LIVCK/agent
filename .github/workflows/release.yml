name: release

# Cut a GitHub release on a v* tag: cross-build the static agent binary
# (amd64 + arm64), package deb + rpm via nfpm, cosign-SIGN every artifact, and
# upload everything under VERSIONLESS asset names. get.livck.cloud redirects
# /<fmt>/latest/<file> to releases/latest/download/<file>, so GitHub's moving
# "latest" pointer (driven by the versioned tag) plus versionless assets make both
# the `latest` install path and a pinned `/<fmt>/vX.Y.Z/<file>` path resolve to the
# same files. install.sh fetches exactly these names (livck-agent_amd64.deb,
# livck-agent_x86_64.rpm, livck-agent_linux_amd64, …).
#
# Supply-chain trust anchor: each artifact ships a cosign SIGNATURE sidecar
# (<file>.sig). The upgrade path (internal/update) verifies it against the release
# PUBLIC key compiled into the binary — the private key lives OFFLINE (1Password,
# mirrored to the COSIGN_PRIVATE_KEY/COSIGN_PASSWORD repo secrets), never in git. A
# compromised origin can serve any bytes AND any signature, but only artifacts
# signed by the offline key install. The legacy .sha256 sidecars stay for agents
# <= v0.2.x (which verify same-origin checksums, not signatures) — harmless once
# every host is on a signature-verifying build.
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write # create the release + upload assets

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Same source as CI: the release line from .go-version, newest patch.
          go-version-file: .go-version
          check-latest: true
          cache: true
          cache-dependency-path: go.sum

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Resolve version
        id: v
        run: |
          # Tag build -> strip the leading v; manual dispatch -> a dev stamp (no
          # release is published on dispatch, only the build is exercised).
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build binaries + deb/rpm
        run: make package VERSION=${{ steps.v.outputs.version }}

      - name: Normalize to versionless asset names + checksums
        working-directory: dist
        run: |
          set -eu
          # deb: livck-agent_<ver>-<rel>_<arch>.deb -> livck-agent_<arch>.deb
          for a in amd64 arm64; do mv -v livck-agent_*_"$a".deb "livck-agent_${a}.deb"; done
          # rpm: livck-agent-<ver>-<rel>.<rpmarch>.rpm -> livck-agent_<rpmarch>.rpm
          for a in x86_64 aarch64; do mv -v livck-agent-*."$a".rpm "livck-agent_${a}.rpm"; done
          # sha256 sidecars for the packages (the raw binaries already carry one
          # from `make dist`). install.sh reads only the hash column.
          for f in livck-agent_amd64.deb livck-agent_arm64.deb livck-agent_x86_64.rpm livck-agent_aarch64.rpm; do
            sha256sum "$f" > "$f.sha256"
          done
          echo "== release assets =="; ls -1

      - name: Install cosign
        if: github.ref_type == 'tag'
        uses: sigstore/cosign-installer@v3

      - name: Sign artifacts (cosign, offline key)
        if: github.ref_type == 'tag'
        working-directory: dist
        env:
          # The signing key + its password live in 1Password (home of record) and are
          # mirrored into these repo secrets so CI can sign. The key content is itself
          # password-encrypted; cosign reads both from the env, so the raw PEM never
          # touches disk in the runner.
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -eu
          if [ -z "${COSIGN_PRIVATE_KEY:-}" ]; then
            echo "::error::COSIGN_PRIVATE_KEY secret is missing — refusing to publish an UNSIGNED release." >&2
            exit 1
          fi
          # Sign every downloadable artifact. --tlog-upload=false keeps signing
          # hermetic (key-based verification never consults Rekor); the sig is the
          # base64 ASN.1/DER ECDSA that internal/update/verify.go checks.
          for f in \
            livck-agent_linux_amd64 livck-agent_linux_arm64 \
            livck-agent_amd64.deb livck-agent_arm64.deb \
            livck-agent_x86_64.rpm livck-agent_aarch64.rpm; do
            cosign sign-blob --yes --tlog-upload=false \
              --key env://COSIGN_PRIVATE_KEY "$f" > "$f.sig"
            test -s "$f.sig" || { echo "::error::empty signature for $f" >&2; exit 1; }
          done
          echo "== signatures =="; ls -1 ./*.sig

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/livck-agent_linux_amd64 dist/livck-agent_linux_amd64.sha256 dist/livck-agent_linux_amd64.sig \
            dist/livck-agent_linux_arm64 dist/livck-agent_linux_arm64.sha256 dist/livck-agent_linux_arm64.sig \
            dist/livck-agent_amd64.deb dist/livck-agent_amd64.deb.sha256 dist/livck-agent_amd64.deb.sig \
            dist/livck-agent_arm64.deb dist/livck-agent_arm64.deb.sha256 dist/livck-agent_arm64.deb.sig \
            dist/livck-agent_x86_64.rpm dist/livck-agent_x86_64.rpm.sha256 dist/livck-agent_x86_64.rpm.sig \
            dist/livck-agent_aarch64.rpm dist/livck-agent_aarch64.rpm.sha256 dist/livck-agent_aarch64.rpm.sig
